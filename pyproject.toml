[project]
name = "zs-workload-forecast"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "statsforecast>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "mpmath>=1.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
